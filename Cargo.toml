[workspace]
members = [
    "crates/dns-core",
    "crates/dns-cli",
]
exclude = [
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/network-infrastructure/dns-optimizer"
homepage = "https://network-infrastructure.github.io/dns-optimizer/"
description = "Cross-platform Rust DNS benchmark, speed test, and DNS changer for Windows, macOS, Linux, and Android"

[workspace.dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
